name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Node Dependencies
        run: npm ci

      - name: Build Web App & Sync Capacitor
        run: npm run cap:sync

      - name: Make Gradle Executable
        run: chmod +x android/gradlew

      - name: Build Android Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon

      - name: Name release APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk project-archive.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ProjectArchive-debug.apk
          path: project-archive.apk

      - name: Create GitHub Release & Upload APK
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Project Archive Android v1.0.${{ github.run_number }}
          body: |
            Installable Android APK for Project Archive.

            Download `project-archive.apk` below, then open it on an Android device.
          files: project-archive.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
